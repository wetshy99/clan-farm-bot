[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clan-farm-bot"
version = "0.1.0"
description = "Bot Discord nông trại Clan + minigame, chỉ dùng /farm, /game, /thongtin, /diemdanh"
requires-python = ">=3.10"
dependencies = ["discord.py>=2.3", "python-dotenv>=1.0"]

[tool.setuptools]
packages = ["bot", "bot.cogs", "bot.games"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PERF", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # văn bản tiếng Việt/emoji

[tool.pytest.ini_options]
testpaths = ["tests"]
